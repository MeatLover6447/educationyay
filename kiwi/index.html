<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Grades and Attendance</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #kiwi-skip-house {
        display: block;
        margin: 10px auto 16px;
        padding: 10px 24px;
        font: 600 15px/1.2 Arial, Helvetica, sans-serif;
        color: #ffe9a8;
        background: #2b2118;
        border: 2px solid #6b5327;
        border-radius: 6px;
        letter-spacing: 0.4px;
        cursor: pointer;
      }
      #kiwi-skip-house:hover { background: #3b2f1f; border-color: #9a7b3c; }
      #kiwi-skip-house[disabled] { opacity: 0.6; cursor: default; }

      /* ============ Fix: anchor the game to the top of the page ============
         Unity's default template absolutely-positions the container and
         vertically centers it with translate(-50%, -50%). When the page is
         taller than the viewport, the top half of the container overflows
         ABOVE the document origin (pixel 0), where it can never be scrolled
         back to. Returning the container to normal document flow makes the
         top of the canvas the top of the scrollable page. */
      html, body {
        margin: 0;
        padding: 0;
      }

      #unity-container.unity-desktop {
        position: static !important;
        left: auto !important;
        top: auto !important;
        transform: none !important;
        width: fit-content;
        margin: 0 auto;
        padding-top: 8px; /* breathing room above the canvas; set to 0 for flush */
      }
      /* ============ End top-anchor fix ============ */

      /* ============ Auto clicker tool bar ============ */
      #kiwi-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: fit-content;
        max-width: 96vw;
        margin: 0 auto 12px;
        padding: 10px 18px;
        font: 600 14px/1.2 Arial, Helvetica, sans-serif;
        color: #ffe9a8;
        background: #1d160f;
        border: 2px solid #6b5327;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      }
      #kiwi-tools button,
      #kiwi-tools input {
        font: inherit;
        color: inherit;
        background: #2b2118;
        border: 2px solid #6b5327;
        border-radius: 6px;
        padding: 8px 16px;
        letter-spacing: 0.4px;
      }
      #kiwi-tools button { cursor: pointer; }
      #kiwi-tools button:hover { background: #3b2f1f; border-color: #9a7b3c; }
      #kiwi-tools button:active { transform: translateY(1px); }
      #kiwi-autoclick-toggle.kiwi-on {
        color: #10240f;
        background: #9ede6a;
        border-color: #cdf3a8;
      }
      #kiwi-autoclick-hotkey.capturing {
        color: #1d160f;
        background: #ffd76a;
        border-color: #fff0b8;
      }
      #kiwi-rate-wrap { display: flex; align-items: center; gap: 8px; }
      #kiwi-autoclick-rate { width: 78px; text-align: center; }
      #kiwi-tools .kiwi-hint {
        flex-basis: 100%;
        text-align: center;
        font-weight: 500;
        font-size: 12px;
        color: #b9a172;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Kiwi Clicker</div>
      </div>
      <button id="kiwi-skip-house" type="button" hidden>Skip the house &rsaquo; play now</button>

      <!-- ============ Auto clicker controls (under the skip button) ============ -->
      <div id="kiwi-tools">
        <button id="kiwi-autoclick-toggle" type="button" aria-pressed="false">Auto Clicker: OFF (F)</button>
        <label id="kiwi-rate-wrap" for="kiwi-autoclick-rate">CPS
          <input id="kiwi-autoclick-rate" type="number" min="1" max="200" step="1" value="20">
        </label>
        <button id="kiwi-autoclick-hotkey" type="button">Hotkey: F</button>
        <span class="kiwi-hint">Clicks only happen while your cursor is over the game. Move the cursor off the canvas to pause clicking.</span>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/index.html.loader.js";
      var config = {
        dataUrl: buildUrl + "/index.html.data.unityweb",
        frameworkUrl: buildUrl + "/index.html.framework.js.unityweb",
        codeUrl: buildUrl + "/index.html.wasm.unityweb",
        symbolsUrl: buildUrl + "/",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tobspr Games",
        productName: "Kiwi Clicker",
        productVersion: "s1.2.4",
        showBanner: unityShowBanner,
      };

      // Render at 1280x720 backing resolution regardless of display scaling.
      // On scaled displays (125-150% is common) this otherwise renders
      // 1600x1080 / 1920x1080, which low-end GPUs cannot afford.
      config.devicePixelRatio = 1;

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // Extra insurance for save persistence: whenever the tab is hidden or
      // about to be closed/refreshed, push the in-memory save file out to
      // IndexedDB immediately. window.kiwiFlush is installed by the game
      // runtime (KiwiSync.jslib) as soon as the player starts.
      window.addEventListener("pagehide", function () {
        try { if (window.kiwiFlush) window.kiwiFlush(); } catch (e) {}
      });
      document.addEventListener("visibilitychange", function () {
        try {
          if (document.visibilityState === "hidden" && window.kiwiFlush) window.kiwiFlush();
        } catch (e) {}
      });

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      // ============ Skip-the-house button ============
      // Shown only while the save is still at the house stage (throneState 0).
      // Clicking applies the same save transition the game performs when the
      // house portal is used (throneState -> 1, everything else preserved),
      // then reloads so HouseSceneBoot routes straight into the main scene.
      (function () {
        var SAVE_KEY_NAME = "kiwiClicker.es3";
        var PRF_HEADER = new Uint8Array([0x55, 0x6e, 0x69, 0x74, 0x79, 0x50, 0x72, 0x66, 0, 0, 1, 0, 0, 0, 16, 0]);
        // Proven post-intro save payload (throneState=1, ComingFromHouse=false,
        // saveIsValid=true). Used when a brand-new visitor skips before the
        // game has written its own ES3 save - verified to boot straight into
        // the main scene and to be overwritten normally by later saves.
        var SEED_VALUE = "sGaIoSboGrrs8v6AMYiN5Dd1h3p5dqkEbmn1YEqmQTWfW0k6GqAVwHqIwt/DT70LMD/Crhigh8HapLsDEniV1dO4fdIeyPG8WzIOZzFP5n/z8PCTBdEBXnQTB5IAweXkFkgOdTXHv/828S8ii64DY2AJZOvtJdJUuHzTy8bl0k5cO868cQmQVoc0u9m+EPpqF/zJmb8rR/NxZp2Dpm7t5f++V0tX11Wy3dkHwfk4MSgokoATYMPzdJEyExaz4KiyG2XuaPHaFrJmmJHQqEVxAFmSs7AAS2lwemjVKgdaFZcqZaDivqcZpH05wxri3LJ297ChaT/SUEh1pW+F8dP5YNouPiIDjcm9btp7dfk+hCA=";
        var btn = document.getElementById("kiwi-skip-house");
        if (!btn) return;
        var enc = new TextEncoder(), dec = new TextDecoder();

        function b2a(u8) { // bytes -> binary string, chunked (no stack overflow)
          var s = "", CH = 8192;
          for (var i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
          return s;
        }
        function a2b(str) {
          var u = new Uint8Array(str.length);
          for (var i = 0; i < str.length; i++) u[i] = str.charCodeAt(i);
          return u;
        }

        function dbExists() {
          if (!indexedDB.databases) return Promise.resolve(true);
          return indexedDB.databases().then(function (list) {
            return list.some(function (d) { return d.name === "/idbfs"; });
          }).catch(function () { return true; });
        }
        function openDb() {
          return dbExists().then(function (yes) {
            if (!yes) return null;
            return new Promise(function (res, rej) {
              var rq = indexedDB.open("/idbfs");
              rq.onerror = function () { rej(rq.error); };
              rq.onsuccess = function () {
                var db = rq.result;
                if (!Array.prototype.includes.call(db.objectStoreNames, "FILE_DATA")) { db.close(); res(null); return; }
                res(db);
              };
            });
          });
        }
        function findPrefsKey(db) {
          return new Promise(function (res) {
            var rq = db.transaction("FILE_DATA", "readonly").objectStore("FILE_DATA").getAllKeys();
            rq.onsuccess = function () {
              var keys = rq.result.map(String);
              var hit = keys.filter(function (k) { return typeof k === "string" && k.endsWith("/PlayerPrefs"); })[0];
              if (hit) return res(hit);
              var dir = keys.filter(function (k) { return /^\/idbfs\/[^/]+$/.test(k); })[0];
              res(dir ? dir + "/PlayerPrefs" : null);
            };
            rq.onerror = function () { res(null); };
          });
        }
        function readRecord(db, key) {
          return new Promise(function (res) {
            var rq = db.transaction("FILE_DATA", "readonly").objectStore("FILE_DATA").get(key);
            rq.onsuccess = function () { res(rq.result || null); };
            rq.onerror = function () { res(null); };
          });
        }
        function putRecord(db, key, bytes) {
          return new Promise(function (res, rej) {
            var tx = db.transaction("FILE_DATA", "readwrite");
            tx.objectStore("FILE_DATA").put({ contents: bytes, mode: 33206, timestamp: new Date() }, key);
            tx.oncomplete = function () { res(); };
            tx.onerror = function () { rej(tx.error); };
            tx.onabort = function () { rej(tx.error); };
          });
        }

        // ---- UnityPrf container: 16B header + entries (u8 nameLen, name,
        // length-prefixed value). The file can hold several keys
        // (unity.player_session_*, kiwiClicker.es3, kiwiClicker.es3.bac, ...).
        // Scan them all so the right one is found no matter the order; every
        // entry except kiwiClicker.es3 is preserved byte-for-byte.
        function scanPrf(u8) {
          if (b2a(u8.subarray(0, 8)) !== "UnityPrf") throw new Error("bad UnityPrf header");
          var entries = [], n = 16;
          while (n < u8.length) {
            var start = n;
            if (start + 2 > u8.length) break;
            var klen = u8[start];
            if (klen === 0 || klen > 127 || start + 2 + klen > u8.length) break;
            var name = b2a(u8.subarray(start + 1, start + 1 + klen));
            if (!/^[ -~]+$/.test(name)) break;
            var p = start + 1 + klen;
            var first = u8[p], vlen, hdrLen;
            if (first & 0x80) {
              if (p + 5 > u8.length) break;
              vlen = (u8[p + 1] | (u8[p + 2] << 8) | (u8[p + 3] << 16) | (u8[p + 4] << 24)) >>> 0;
              hdrLen = 5;
            } else { vlen = first; hdrLen = 1; }
            var valueStart = p + hdrLen;
            if (valueStart + vlen > u8.length) break;
            n = valueStart + vlen;
            entries.push({ name: name, start: start, end: n, valueStart: valueStart, vlen: vlen });
          }
          return entries;
        }
        function framePatchedSave(name, value, before, after) {
          var nameB = enc.encode(name), valB = enc.encode(value);
          var out = new Uint8Array(before.length + 1 + nameB.length + 5 + valB.length + after.length);
          var o = 0;
          out.set(before, o); o += before.length; // includes the UnityPrf header
          out[o++] = nameB.length;
          out.set(nameB, o); o += nameB.length;
          if (valB.length < 0x80) out[o++] = valB.length;
          else {
            out[o++] = 0x80;
            out[o++] = valB.length & 255; out[o++] = (valB.length >>> 8) & 255;
            out[o++] = (valB.length >>> 16) & 255; out[o++] = (valB.length >>> 24) & 255;
          }
          out.set(valB, o); o += valB.length;
          out.set(after, o); o += after.length;
          return out;
        }

        // ---- ES3 crypto: PBKDF2-HMAC-SHA1 (100 iters, salt = IV) + AES-128-CBC
        function aesKeyFor(salt) {
          return crypto.subtle.importKey("raw", enc.encode("gatucha"), "PBKDF2", false, ["deriveBits"])
            .then(function (pk) {
              return crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: 100, hash: "SHA-1" }, pk, 128);
            })
            .then(function (bits) {
              return crypto.subtle.importKey("raw", bits, { name: "AES-CBC" }, false, ["encrypt", "decrypt"]);
            });
        }
        function decodeSave(b64) {
          var raw = a2b(atob(b64));
          var iv = raw.subarray(0, 16), ct = raw.subarray(16);
          return aesKeyFor(iv).then(function (k) {
            return crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, k, ct);
          }).then(function (plain) {
            return JSON.parse(dec.decode(new Uint8Array(plain)));
          });
        }
        function encodeSave(obj) {
          var iv = crypto.getRandomValues(new Uint8Array(16));
          return aesKeyFor(iv).then(function (k) {
            return crypto.subtle.encrypt({ name: "AES-CBC", iv: iv }, k, enc.encode(JSON.stringify(obj)));
          }).then(function (ct) {
            var all = new Uint8Array(16 + ct.byteLength);
            all.set(iv); all.set(new Uint8Array(ct), 16);
            return btoa(b2a(all));
          });
        }
        // Values are stored either plain or wrapped as {__type, value} by ES3.
        function unwrap(v) {
          if (v && typeof v === "object" && "value" in v && typeof v.value === "number") return v.value;
          return v;
        }
        function throneStateOf(json) {
          var holder = (json && json.value && typeof json.value === "object") ? json.value : json;
          var t = holder ? unwrap(holder.throneState) : undefined;
          return typeof t === "number" ? t : 0;
        }
        function setThroneState(json, v) {
          var holder = (json && json.value && typeof json.value === "object") ? json.value : json;
          if (holder && holder.throneState && typeof holder.throneState === "object" && "value" in holder.throneState) {
            holder.throneState.value = v; // keep the {__type, value} wrapper intact
          } else if (holder) {
            holder.throneState = v;
          } else {
            json.throneState = v;
          }
          return json;
        }

        // -> {key, u8} once the PlayerPrefs record exists, else null
        function readSaveRecord() {
          return openDb().then(function (db) {
            if (!db) return null;
            return findPrefsKey(db).then(function (key) {
              if (!key) { db.close(); return null; }
              return readRecord(db, key).then(function (rec) {
                db.close();
                if (!rec || !rec.contents) return null;
                return { key: key, u8: new Uint8Array(rec.contents) };
              });
            });
          });
        }
        // -> {json, before, after} for the kiwiClicker.es3 entry,
        //    or null when the game hasn't written its ES3 save yet
        function decodeEntry(u8) {
          var entries = scanPrf(u8);
          var target = null;
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].name === SAVE_KEY_NAME) { target = entries[i]; break; }
          }
          if (!target) return Promise.resolve(null);
          var value = b2a(u8.subarray(target.valueStart, target.valueStart + target.vlen));
          return decodeSave(value).then(function (json) {
            return { json: json, before: u8.subarray(0, target.start), after: u8.subarray(target.end) };
          });
        }

        function refreshVisibility(attempt) {
          readSaveRecord()
            .then(function (r) {
              if (!r) return { fresh: true };
              return decodeEntry(r.u8).then(function (d) {
                return d ? { fresh: false, json: d.json } : { fresh: true };
              });
            })
            .then(function (info) {
              if (info.fresh) {
                // Save file not written yet (fresh visitor) - keep checking briefly.
                if (attempt < 4) setTimeout(function () { refreshVisibility(attempt + 1); }, 2500);
                else btn.hidden = false;
                return;
              }
              btn.hidden = throneStateOf(info.json) !== 0;
            })
            .catch(function () {
              // Cannot verify the save -> never risk showing a destructive action.
              btn.hidden = true;
            });
        }

        btn.addEventListener("click", function () {
          if (btn.disabled) return;
          btn.disabled = true;
          var label = btn.textContent;
          btn.textContent = "Loading\u2026";
          // Stop the running game from flushing its old in-memory save over our patch.
          window.kiwiFlush = function () {};
          var deadline = Date.now() + 30000;
          (function waitAndPatch() {
            readSaveRecord()
              .then(function (r) {
                if (!r) {
                  if (Date.now() < deadline) return null; // wait for the record to appear
                  throw new Error("save file did not appear");
                }
                return decodeEntry(r.u8).then(function (d) {
                  if (d) {
                    // Existing game save: bump only throneState - all progress,
                    // the .bac backup and Unity's own entries stay intact.
                    setThroneState(d.json, 1);
                    return encodeSave(d.json).then(function (b64) {
                      return { key: r.key, bytes: framePatchedSave(SAVE_KEY_NAME, b64, d.before, d.after) };
                    });
                  }
                  // Fresh visitor with no ES3 save yet: install the proven
                  // post-intro seed as the kiwiClicker.es3 entry, keeping
                  // Unity's own entries in place.
                  var wellFormed = r.u8.length >= 16 && b2a(r.u8.subarray(0, 8)) === "UnityPrf";
                  var bytes = framePatchedSave(SAVE_KEY_NAME, SEED_VALUE,
                    wellFormed ? r.u8.subarray(0, 16) : PRF_HEADER,
                    wellFormed ? r.u8.subarray(16) : new Uint8Array(0));
                  return { key: r.key, bytes: bytes };
                });
              })
              .then(function (res) {
                if (!res) { setTimeout(waitAndPatch, 750); return; }
                return openDb().then(function (db) {
                  if (!db) throw new Error("database unavailable");
                  return putRecord(db, res.key, res.bytes).then(function () { db.close(); });
                }).then(function () { location.reload(); });
              })
              .catch(function (e) {
                console.error("skip-house failed:", e);
                btn.disabled = false;
                btn.textContent = label;
              });
          })();
        });

        refreshVisibility(0);
      })();
      // ============ End skip-the-house button ============

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>

    <!-- ============ Auto clicker ============ -->
    <script>
      (function () {
        "use strict";

        var canvas = document.getElementById("unity-canvas");
        var toggleBtn = document.getElementById("kiwi-autoclick-toggle");
        var hotkeyBtn = document.getElementById("kiwi-autoclick-hotkey");
        var rateInput = document.getElementById("kiwi-autoclick-rate");
        if (!canvas || !toggleBtn || !hotkeyBtn || !rateInput) return;

        var STORE_KEY = "kiwiClicker.autoclicker.v1";
        var state = { running: false, cps: 20, hotkey: "KeyF" };
        var capturing = false;   // waiting for the user to press a new hotkey
        var timerId = null;
        var nextAt = 0;
        var lastPoint = null;    // cursor position, only set while over the canvas

        /* ---------------- persistence ---------------- */
        try {
          var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
          if (saved) {
            if (typeof saved.cps === "number" && saved.cps >= 1 && saved.cps <= 200) {
              state.cps = Math.round(saved.cps);
            }
            if (typeof saved.hotkey === "string" && /^[A-Za-z0-9]+$/.test(saved.hotkey)) {
              state.hotkey = saved.hotkey;
            }
          }
        } catch (e) {}

        function persist() {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify({ cps: state.cps, hotkey: state.hotkey }));
          } catch (e) {}
        }

        /* ---------------- key labels ---------------- */
        var KEY_NAMES = {
          Space: "Space", Escape: "Esc", Enter: "Enter", Tab: "Tab", Backspace: "Backspace",
          ArrowUp: "\u2191", ArrowDown: "\u2193", ArrowLeft: "\u2190", ArrowRight: "\u2192",
          Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]",
          Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/",
          Backslash: "\\", Backquote: "`",
          ControlLeft: "L-Ctrl", ControlRight: "R-Ctrl",
          ShiftLeft: "L-Shift", ShiftRight: "R-Shift",
          AltLeft: "L-Alt", AltRight: "R-Alt",
          MetaLeft: "L-Meta", MetaRight: "R-Meta"
        };
        function keyLabel(code) {
          if (!code) return "\u2014";
          if (code.indexOf("Key") === 0) return code.slice(3);
          if (code.indexOf("Digit") === 0) return code.slice(5);
          if (code.indexOf("Numpad") === 0) return "Num " + code.slice(6);
          return KEY_NAMES[code] || code;
        }

        /* ---------------- cursor tracking ---------------- */
        // lastPoint is only non-null while the cursor is over the canvas.
        // Moving the cursor anywhere else (page, tool bar, outside the window)
        // clears it, which makes the click loop simply skip its click.
        function isOverCanvas(x, y) {
          var r = canvas.getBoundingClientRect();
          return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        }
        window.addEventListener("mousemove", function (e) {
          lastPoint = isOverCanvas(e.clientX, e.clientY)
            ? { x: e.clientX, y: e.clientY }
            : null;
        }, true);
        canvas.addEventListener("mouseleave", function () { lastPoint = null; });
        window.addEventListener("blur", function () { lastPoint = null; });
        document.addEventListener("mouseleave", function () { lastPoint = null; });

        function eventOptions(x, y, buttons) {
          return {
            bubbles: true, cancelable: true, composed: true, view: window,
            clientX: x, clientY: y, screenX: x, screenY: y,
            button: 0, buttons: buttons, detail: 1,
            pointerId: 1, pointerType: "mouse", isPrimary: true,
            width: 1, height: 1, pressure: buttons ? 0.5 : 0
          };
        }

        function fireClick() {
          // Only click when the cursor is actually over the game canvas.
          // Otherwise the click is skipped entirely (no clicks on the page,
          // no clicks aimed at the centre of the canvas).
          if (!lastPoint) return;
          var x = lastPoint.x, y = lastPoint.y;

          if (window.PointerEvent) {
            try {
              canvas.dispatchEvent(new PointerEvent("pointerdown", eventOptions(x, y, 1)));
              canvas.dispatchEvent(new PointerEvent("pointerup", eventOptions(x, y, 0)));
            } catch (e) {}
          }
          canvas.dispatchEvent(new MouseEvent("mousedown", eventOptions(x, y, 1)));
          canvas.dispatchEvent(new MouseEvent("mouseup", eventOptions(x, y, 0)));
        }

        /* ---------------- the click loop ---------------- */
        function tick() {
          timerId = null;
          if (!state.running) return;

          fireClick();

          var now = performance.now();
          nextAt += 1000 / state.cps;
          if (nextAt < now) nextAt = now; // never build up a backlog
          timerId = setTimeout(tick, nextAt - now);
        }

        function setRunning(on) {
          on = !!on;
          state.running = on;
          if (on) {
            nextAt = performance.now();
            if (timerId === null) tick();
          } else if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
          }
          renderToggle();
        }

        /* ---------------- rendering ---------------- */
        function renderToggle() {
          toggleBtn.textContent = "Auto Clicker: " + (state.running ? "ON" : "OFF") +
                                  "  (" + keyLabel(state.hotkey) + ")";
          toggleBtn.classList.toggle("kiwi-on", state.running);
          toggleBtn.setAttribute("aria-pressed", state.running ? "true" : "false");
        }

        function renderHotkey() {
          hotkeyBtn.textContent = capturing
            ? "Press a key\u2026 (Esc to cancel)"
            : "Hotkey: " + keyLabel(state.hotkey);
          hotkeyBtn.classList.toggle("capturing", capturing);
        }

        /* ---------------- UI wiring ---------------- */
        toggleBtn.addEventListener("click", function () {
          setRunning(!state.running);
          toggleBtn.blur(); // otherwise Space/Enter would re-trigger the button
        });

        hotkeyBtn.addEventListener("click", function () {
          capturing = true;
          renderHotkey();
          hotkeyBtn.blur();
        });

        rateInput.value = String(state.cps);
        rateInput.addEventListener("change", function () {
          var v = parseFloat(rateInput.value);
          if (!isFinite(v)) v = state.cps;
          state.cps = Math.min(200, Math.max(1, Math.round(v)));
          rateInput.value = String(state.cps);
          persist();
        });

        /* ---------------- global hotkey ---------------- */
        window.addEventListener("keydown", function (e) {
          var t = e.target;
          var typing = !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);

          if (capturing) {
            if (typing) return;                 // let the CPS field be typed in
            e.preventDefault();
            e.stopPropagation();
            if (e.code === "Escape") { capturing = false; renderHotkey(); return; }
            if (/^(Control|Shift|Alt|Meta)(Left|Right)$/.test(e.code)) return; // wait for a real key
            state.hotkey = e.code;
            capturing = false;
            persist();
            renderHotkey();
            return;
          }

          if (typing || e.repeat) return;
          if (e.code !== state.hotkey) return;

          // Swallow the key so the game does not also react to it.
          e.preventDefault();
          e.stopPropagation();
          setRunning(!state.running);
        }, true);

        /* ---------------- init ---------------- */
        renderHotkey();
        renderToggle();
      })();
      // ============ End auto clicker ============
    </script>
  </body>
</html>
