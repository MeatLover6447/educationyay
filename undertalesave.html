<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Undertale Room Changer</title>
<style>
body{margin:0;padding:20px;background:#000;color:#eee;font:14px monospace}
h1{font-size:18px;margin:0 0 14px}
.box{border:1px solid #444;padding:12px;margin-bottom:12px;max-width:640px}
button{font:inherit;background:#eee;color:#000;border:0;padding:8px 12px;cursor:pointer;margin:2px}
button:hover{background:#ff0}
button.go{background:#0f0}
button.warnbtn{background:#f90}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:#eee}
input,select{font:inherit;background:#111;color:#0f0;border:1px solid #555;padding:6px;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:flex-end}
.row>div{flex:1}
label{display:block;font-size:12px;color:#999;margin-bottom:4px}
#files div{padding:8px;border-bottom:1px solid #222;cursor:pointer}
#files div:hover{background:#181818}
#files div.sel{background:#032;color:#0f0}
#msg{white-space:pre-wrap;min-height:20px;margin-top:6px}
.err{color:#f55}.ok{color:#0f0}.warn{color:#ff0}
.tiny{font-size:12px;color:#777;line-height:1.5}
</style>
</head>
<body>

<h1>UNDERTALE — ROOM CHANGER (safe)</h1>

<div class="box">
  <button onclick="connect()">CONNECT</button>
  <button onclick="listFiles()">REFRESH</button>
  <div id="msg">Not connected.</div>
</div>

<div class="box">
  <label>Save files</label>
  <div id="files" style="border:1px solid #333;max-height:220px;overflow:auto">(not connected)</div>
</div>

<div class="box">
  <div class="row">
    <div>
      <label>Current room (line 548)</label>
      <input id="cur" readonly value="—">
    </div>
    <div>
      <label>New room</label>
      <input id="newRoom" type="number" min="1" placeholder="e.g. 68">
    </div>
    <div style="flex:0 0 auto">
      <button class="go" id="write" disabled onclick="writeClick()">WRITE</button>
    </div>
  </div>
  <div style="margin-top:10px">
    <label>Common rooms</label>
    <select id="preset" onchange="if(this.value)document.getElementById('newRoom').value=this.value">
      <option value="">-- pick to fill the box --</option>
      <option value="6">6 — Ruins Entrance</option>
      <option value="31">31 — Ruins Home</option>
      <option value="41">41 — Toriel Boss Room</option>
      <option value="68">68 — Snowdin Town</option>
      <option value="81">81 — Papyrus Battle</option>
      <option value="94">94 — Waterfall Crystal</option>
      <option value="134">134 — Undyne Arena</option>
      <option value="183">183 — Hotland Hotel Lobby</option>
      <option value="210">210 — CORE End</option>
      <option value="231">231 — Last Corridor</option>
      <option value="235">235 — Throne Room</option>
      <option value="236">236 — The End</option>
      <option value="246">246 — True Lab</option>
    </select>
  </div>
  <div style="margin-top:10px">
    <button onclick="downloadBackup()" id="bk" disabled>DOWNLOAD BACKUP</button>
    <button onclick="revert()" id="rv" disabled>REVERT TO LOADED STATE</button>
  </div>
  <div class="tiny" style="margin-top:10px">
    Close Undertale fully before writing. Only <b>file0</b> holds the room.
    Rooms outside the real range will trigger the dog screen or a white screen.
  </div>
</div>

<script>
const DB_NAME = "/_savedata", STORE = "FILE_DATA", ROOM_LINE = 548;
const $ = id => document.getElementById(id);

let db = null;
let key = null;
let rec = null;
let pristine = null;      // exact bytes as originally loaded
let contentsKind = "u8";
let armed = false;
let armTimer = null;

function say(msg, cls){
  const m = $("msg");
  m.textContent = msg;
  m.className = cls || "";
}

/* ---------- IndexedDB connect ---------- */
function connect(){
  say("Connecting…");
  let aborted = false;
  const r = indexedDB.open(DB_NAME);
  r.onupgradeneeded = e => { aborted = true; try{ e.target.transaction.abort(); }catch(_){} };
  r.onerror = e => {
    if(aborted) say("No Undertale save database on this browser/origin yet.\nPlay the game once here first.", "err");
    else say("Could not open database: " + (e.target.error && e.target.error.message || "unknown"), "err");
  };
  r.onsuccess = e => {
    db = e.target.result;
    if(!db.objectStoreNames.contains(STORE)){
      say("Save database found, but no FILE_DATA store.", "err");
      return;
    }
    say("Connected.", "ok");
    listFiles();
  };
}

/* ---------- file list ---------- */
function listFiles(){
  if(!db){ say("Connect first.", "err"); return; }
  const box = $("files");
  box.innerHTML = "";
  const r = db.transaction(STORE, "readonly").objectStore(STORE).openCursor();
  let n = 0;
  r.onsuccess = e => {
    const c = e.target.result;
    if(!c){
      if(!n){ box.textContent = "(no files found)"; say("No save files found.", "err"); }
      else say(n + " file(s) found. Pick file0.", "ok");
      return;
    }
    const k = c.key; n++;
    const d = document.createElement("div");
    d.textContent = k;
    d.onclick = () => pick(k);
    box.appendChild(d);
    c.continue();
  };
  r.onerror = e => say("Could not read files: " + (e.target.error && e.target.error.message || "unknown"), "err");
}

/* ---------- load one file ---------- */
function pick(k){
  const req = db.transaction(STORE, "readonly").objectStore(STORE).get(k);
  req.onsuccess = e => {
    const r0 = e.target.result;
    if(!r0){ say("Could not read " + k, "err"); return; }
    const bytes = toBytes(r0.contents);
    if(!bytes){ say("Unsupported record format for " + k, "err"); return; }

    key = k;
    rec = r0;
    contentsKind = kindOf(r0.contents);
    pristine = bytes.slice();       // exact copy
    armed = false;
    clearArmTimer();

    [...$("files").children].forEach(d => d.classList.toggle("sel", d.textContent === String(k)));

    const cur = readLine(bytes, ROOM_LINE);
    $("cur").value = (cur === null ? "(line missing)" : cur);
    $("newRoom").value = (cur === null ? "" : cur);
    $("write").disabled = false;
    $("bk").disabled = false;
    $("rv").disabled = false;
    $("write").textContent = "WRITE";
    $("write").classList.remove("warnbtn");

    say("Loaded " + k + " (" + bytes.length + " bytes, contents kind: " + contentsKind + ").", "ok");
  };
  req.onerror = e => say("Read failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
}

/* ---------- byte helpers ---------- */
function toBytes(x){
  if(x instanceof Uint8Array) return x;
  if(x instanceof ArrayBuffer) return new Uint8Array(x);
  if(Array.isArray(x)) return new Uint8Array(x);
  if(x && x.buffer) return new Uint8Array(x.buffer, x.byteOffset || 0, x.byteLength || x.buffer.byteLength);
  return null;
}
function kindOf(x){
  if(x instanceof Uint8Array) return "u8";
  if(x instanceof ArrayBuffer) return "ab";
  if(Array.isArray(x)) return "arr";
  if(ArrayBuffer.isView(x)) return "u8";
  return "u8";
}
function makeContents(bytes){
  if(contentsKind === "ab") return bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
  if(contentsKind === "arr") return Array.from(bytes);
  return bytes;
}

/* Find the byte range [start, end) of the Nth 1-based line's content.
   Handles \n and \r\n. Does NOT include the line separator. */
function findLine(bytes, n){
  let line = 1, start = 0;
  for(let i = 0; i < bytes.length; i++){
    if(bytes[i] === 0x0A){
      if(line === n){
        let end = i;
        if(end > start && bytes[end - 1] === 0x0D) end--;
        return { start, end };
      }
      line++;
      start = i + 1;
    }
  }
  if(line === n) return { start, end: bytes.length };
  return null;
}
function readLine(bytes, n){
  const loc = findLine(bytes, n);
  if(!loc) return null;
  return new TextDecoder().decode(bytes.subarray(loc.start, loc.end));
}

/* ---------- two-click confirm ---------- */
function writeClick(){
  if(!armed){
    armed = true;
    $("write").textContent = "CLICK AGAIN TO CONFIRM";
    $("write").classList.add("warnbtn");
    armTimer = setTimeout(() => {
      armed = false;
      $("write").textContent = "WRITE";
      $("write").classList.remove("warnbtn");
    }, 4000);
    say("Click WRITE again within 4 seconds to confirm.", "warn");
    return;
  }
  armed = false;
  clearArmTimer();
  $("write").textContent = "WRITE";
  $("write").classList.remove("warnbtn");
  doWrite();
}
function clearArmTimer(){ if(armTimer){ clearTimeout(armTimer); armTimer = null; } }

/* ---------- write ---------- */
function doWrite(){
  if(!key || !rec || !pristine) return;

  const v = $("newRoom").value.trim();
  if(!/^\d+$/.test(v)){ say("Room must be a whole number.", "err"); return; }
  const n = parseInt(v, 10);
  if(n < 1 || n > 400){ say("Room must be between 1 and 400.", "err"); return; }

  const loc = findLine(pristine, ROOM_LINE);
  if(!loc){ say("Line " + ROOM_LINE + " not found — refusing to write.", "err"); return; }

  const val = new TextEncoder().encode(String(n));
  const before = pristine.subarray(0, loc.start);
  const after  = pristine.subarray(loc.end);
  const out = new Uint8Array(before.length + val.length + after.length);
  out.set(before, 0);
  out.set(val, before.length);
  out.set(after, before.length + val.length);

  const copy = {};
  for(const p in rec) copy[p] = rec[p];
  copy.contents = makeContents(out);

  let putOk = false;
  try {
    const tx = db.transaction(STORE, "readwrite");
    tx.onerror = e => say("Transaction failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
    const req = tx.objectStore(STORE).put(copy, key);
    req.onsuccess = () => { putOk = true; verifyAfterWrite(n, out); };
    req.onerror   = e => say("Write failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
  } catch(err){
    say("Write threw: " + (err && err.message || err), "err");
    return;
  }

  if(!putOk) return; // verification is triggered from onsuccess
}

function verifyAfterWrite(expectedRoom, writtenBytes){
  const vreq = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
  vreq.onsuccess = e => {
    const got = toBytes(e.target.result.contents);
    const room = readLine(got, ROOM_LINE);
    if(room === String(expectedRoom)){
      pristine = got.slice();       // now this is our new baseline
      rec = e.target.result;
      $("cur").value = room;
      say("Saved and verified. Room " + expectedRoom + " is now in " + key + ".\nLaunch Undertale and load the save.", "ok");
    } else {
      say("Write reported success but verification failed (read back: " + room + ").", "err");
    }
  };
  vreq.onerror = () => say("Saved, but could not verify.", "warn");
}

/* ---------- backup / revert ---------- */
function downloadBackup(){
  if(!pristine) return;
  const blob = new Blob([pristine], { type: "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = String(key).replace(/[\/\\]/g, "_") + ".backup";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say("Backup downloaded.", "ok");
}

function revert(){
  if(!pristine || !rec || !key) return;
  if(!armed2()) return;
  const copy = {};
  for(const p in rec) copy[p] = rec[p];
  copy.contents = makeContents(pristine);
  const tx = db.transaction(STORE, "readwrite");
  const req = tx.objectStore(STORE).put(copy, key);
  req.onsuccess = () => {
    rec = copy;
    const cur = readLine(pristine, ROOM_LINE);
    $("cur").value = (cur === null ? "(missing)" : cur);
    $("newRoom").value = (cur === null ? "" : cur);
    say("Reverted " + key + " to the state it had when you loaded it.", "ok");
  };
  req.onerror = e => say("Revert failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
}

/* second two-click confirm for revert */
let armedRevert = false, revertTimer = null;
function armed2(){
  if(!armedRevert){
    armedRevert = true;
    $("rv").textContent = "CLICK AGAIN TO REVERT";
    $("rv").classList.add("warnbtn");
    revertTimer = setTimeout(() => {
      armedRevert = false;
      $("rv").textContent = "REVERT TO LOADED STATE";
      $("rv").classList.remove("warnbtn");
    }, 4000);
    say("Click REVERT again within 4 seconds to confirm.", "warn");
    return false;
  }
  armedRevert = false;
  if(revertTimer){ clearTimeout(revertTimer); revertTimer = null; }
  $("rv").textContent = "REVERT TO LOADED STATE";
  $("rv").classList.remove("warnbtn");
  return true;
}
</script>
</body>
</html>
