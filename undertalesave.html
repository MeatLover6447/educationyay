<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Undertale Room Changer</title>
<style>
body{margin:0;padding:20px;background:#000;color:#eee;font:14px monospace}
h1{font-size:18px;margin:0 0 14px}
.box{border:1px solid #444;padding:12px;margin-bottom:12px;max-width:620px}
button{font:inherit;background:#eee;color:#000;border:0;padding:8px 12px;cursor:pointer;margin:2px}
button:hover{background:#ff0}
button.go{background:#0f0}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:#eee}
input,select{font:inherit;background:#111;color:#0f0;border:1px solid #555;padding:6px;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:flex-end}
.row>div{flex:1}
label{display:block;font-size:12px;color:#999;margin-bottom:4px}
#files div{padding:8px;border-bottom:1px solid #222;cursor:pointer}
#files div:hover{background:#181818}
#files div.sel{background:#032;color:#0f0}
#msg{white-space:pre-wrap;min-height:20px;margin-top:6px}
.err{color:#f55}.ok{color:#0f0}.warn{color:#ff0}
.tiny{font-size:12px;color:#777;line-height:1.5}
b.room{color:#0f0}
</style>
</head>
<body>

<h1>UNDERTALE — ROOM CHANGER</h1>

<div class="box">
  <button onclick="connect()">CONNECT</button>
  <button onclick="listFiles()">REFRESH</button>
  <div id="msg">Not connected.</div>
</div>

<div class="box">
  <label>Save files</label>
  <div id="files" style="border:1px solid #333;max-height:220px;overflow:auto">(not connected)</div>
</div>

<div class="box">
  <div class="row">
    <div>
      <label>Current room (line 548)</label>
      <input id="cur" readonly value="—">
    </div>
    <div>
      <label>New room</label>
      <input id="newRoom" type="number" min="1" placeholder="e.g. 68">
    </div>
    <div style="flex:0 0 auto">
      <button class="go" id="write" disabled onclick="write()">WRITE</button>
    </div>
  </div>
  <div style="margin-top:10px">
    <label>Common rooms</label>
    <select id="preset" onchange="if(this.value)$('newRoom').value=this.value">
      <option value="">-- pick to fill the box --</option>
      <option value="6">6 — Ruins Entrance</option>
      <option value="31">31 — Ruins Home</option>
      <option value="41">41 — Toriel Boss Room</option>
      <option value="68">68 — Snowdin Town</option>
      <option value="81">81 — Papyrus Battle</option>
      <option value="94">94 — Waterfall Crystal</option>
      <option value="134">134 — Undyne Arena</option>
      <option value="183">183 — Hotland Hotel Lobby</option>
      <option value="210">210 — CORE End</option>
      <option value="231">231 — Last Corridor</option>
      <option value="235">235 — Throne Room</option>
      <option value="236">236 — The End</option>
      <option value="246">246 — True Lab</option>
    </select>
  </div>
  <div class="tiny" style="margin-top:10px">
    Close Undertale before writing. Only <b>file0</b> holds the room.
    Setting a room the game doesn't recognize can trigger the Annoying Dog screen.
  </div>
</div>

<script>
const DB_NAME = "/_savedata", STORE = "FILE_DATA", ROOM_LINE = 548;
const $ = id => document.getElementById(id);
let db = null, key = null, rec = null, lines = null, eol = "\n";

function say(t, c){ const m = $("msg"); m.textContent = t; m.className = c || ""; }

/* ---------- connect ---------- */
function connect(){
  say("Connecting...");
  let aborted = false;
  const r = indexedDB.open(DB_NAME);
  r.onupgradeneeded = e => { aborted = true; try{ e.target.transaction.abort(); }catch(_){} };
  r.onerror = e => {
    if(aborted) say("No Undertale save database on this browser/origin yet.\nPlay the game once here first.", "err");
    else say("Could not open database: " + (e.target.error && e.target.error.message || "unknown"), "err");
  };
  r.onsuccess = e => {
    db = e.target.result;
    if(!db.objectStoreNames.contains(STORE)){ say("Save database found, but no FILE_DATA store.", "err"); return; }
    say("Connected.", "ok");
    listFiles();
  };
}

/* ---------- file list ---------- */
function listFiles(){
  if(!db){ say("Connect first.", "err"); return; }
  const box = $("files");
  box.innerHTML = "";
  const r = db.transaction(STORE, "readonly").objectStore(STORE).openCursor();
  let n = 0;
  r.onsuccess = e => {
    const c = e.target.result;
    if(!c){
      if(!n){ box.textContent = "(no files found)"; say("No save files found.", "err"); }
      else say(n + " file(s) found. Pick file0.", "ok");
      return;
    }
    const k = c.key; n++;
    const d = document.createElement("div");
    d.textContent = k;
    d.onclick = () => pick(k);
    box.appendChild(d);
    c.continue();
  };
  r.onerror = e => say("Could not read files: " + (e.target.error && e.target.error.message || "unknown"), "err");
}

/* ---------- load one file ---------- */
function pick(k){
  const req = db.transaction(STORE, "readonly").objectStore(STORE).get(k);
  req.onsuccess = e => {
    const r0 = e.target.result;
    if(!r0){ say("Could not read " + k, "err"); return; }

    const bytes = toBytes(r0.contents);
    if(!bytes){ say("Unsupported record format for " + k, "err"); return; }

    const text = new TextDecoder().decode(bytes);
    eol = text.includes("\r\n") ? "\r\n" : "\n";
    lines = text.split(/\r\n|\n/);

    key = k; rec = r0;

    [...$("files").children].forEach(d => d.classList.toggle("sel", d.textContent === String(k)));

    const cur = lines[ROOM_LINE - 1];
    $("cur").value = (cur === undefined ? "(missing)" : cur);
    $("newRoom").value = (cur === undefined ? "" : cur);
    $("write").disabled = false;

    say("Loaded " + k + " (" + lines.length + " lines).", "ok");
  };
  req.onerror = e => say("Read failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
}

function toBytes(x){
  if(x instanceof Uint8Array) return x;
  if(x instanceof ArrayBuffer) return new Uint8Array(x);
  if(Array.isArray(x)) return new Uint8Array(x);
  if(x && x.buffer) return new Uint8Array(x.buffer, x.byteOffset || 0, x.byteLength);
  return null;
}

/* ---------- write ---------- */
function write(){
  if(!key || !rec || !lines) return;

  const v = $("newRoom").value.trim();
  if(!/^\d+$/.test(v)){ say("Room must be a whole number.", "err"); return; }
  const n = parseInt(v, 10);
  if(n < 1){ say("Room must be 1 or higher.", "err"); return; }
  if(n > 400){ say("Room " + n + " is almost certainly not a real room — that will trigger the dog screen.", "err"); return; }

  if(lines.length < ROOM_LINE){
    say("This file has only " + lines.length + " lines — refusing to write line " + ROOM_LINE + ".", "err");
    return;
  }

  if(!confirm("Set room to " + n + " in " + key + "?\n\nMake sure Undertale is fully closed.")) return;

  lines[ROOM_LINE - 1] = String(n);
  const out = lines.join(eol);

  const bytes = new TextEncoder().encode(out);
  const copy = Object.assign({}, rec);
  copy.contents = (rec.contents instanceof ArrayBuffer) ? bytes.buffer : bytes;

  const req = db.transaction(STORE, "readwrite").objectStore(STORE).put(copy, key);
  req.onsuccess = () => {
    rec = copy;
    $("cur").value = String(n);
    say("Saved. Room " + n + " written to " + key + ".\nLoad the save in Undertale.", "ok");
  };
  req.onerror = e => say("Write failed: " + (e.target.error && e.target.error.message || "unknown"), "err");
}
</script>
</body>
</html>
