<!--balatro HTML with Embedded CSS-->
<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="6e9b1de4-1a48-493a-a06e-3d23a78bbd3e"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grades and Attendance</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
       body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
</style>
</head>
<body>
<div class="container">
    <label for="urlInput">paste full url</label>
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button id="goButton">Go</button>
</div>

<script>
    document.getElementById('goButton').addEventListener('click', function() {
        let url = document.getElementById('urlInput').value;
        if (url) {
            window.open('https://truffled.cv/studying/frame/?mode=preview&url=' + encodeURIComponent(url), '_blank');
        } else {
            alert('Please paste a URL first.');
        }
    });
</script>

</body>
</html>
